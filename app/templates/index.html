{% extends "base.html" %}
{% block content %}
<div class="card search-card">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('asset', this)">{{ labels.tab_asset }}</button>
    <button class="tab-btn" onclick="switchTab('user', this)">{{ labels.tab_user }}</button>
  </div>

  <div class="tab-panel" id="panel-asset">
    <div class="input-group">
      <input
        type="text"
        id="tag-input"
        placeholder="{{ labels.search_placeholder_tag }}"
        autocomplete="off"
        class="input"
      >
      <button type="button" class="btn btn-primary" onclick="lookupAsset()">
        {{ labels.btn_lookup_asset }}
      </button>
    </div>
  </div>

  <div class="tab-panel hidden" id="panel-user">
    <div class="input-group">
      <input
        type="text"
        id="user-input"
        placeholder="{{ labels.search_placeholder_user }}"
        autocomplete="off"
        class="input"
      >
      <button type="button" class="btn btn-primary" onclick="lookupUser()">
        {{ labels.btn_lookup_user }}
      </button>
    </div>
  </div>
</div>

<script>
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.remove('hidden');
  const input = document.querySelector('#panel-' + name + ' input');
  if (input) input.focus();
}

function lookupAsset() {
  const tag = document.getElementById('tag-input').value.trim();
  if (tag) window.location.href = '/assets/' + encodeURIComponent(tag) + '/preview';
}
function lookupUser() {
  const user = document.getElementById('user-input').value.trim();
  if (user) window.location.href = '/users/' + encodeURIComponent(user) + '/preview';
}

document.getElementById('tag-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookupAsset();
});
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookupUser();
});

// Focus the first input on load
document.getElementById('tag-input').focus();
</script>
{% endblock %}
