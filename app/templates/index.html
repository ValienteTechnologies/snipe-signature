{% extends "base.html" %}
{% block content %}
{% if request.root_path %}
<div class="back-link"><a href="/">&#8592; Snipe-IT</a></div>
{% endif %}
<div class="card search-card">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('user', this)">{{ labels.tab_user }}</button>
    <button class="tab-btn" onclick="switchTab('asset', this)">{{ labels.tab_asset }}</button>
  </div>

  <div class="tab-panel" id="panel-user">
    <div class="user-search-wrap">
      <div class="input-group">
        <input
          type="text"
          id="user-input"
          placeholder="{{ labels.search_placeholder_user }}"
          autocomplete="off"
          class="input"
        >
        <button type="button" class="btn btn-primary" onclick="lookupUser()">
          {{ labels.btn_lookup_user }}
        </button>
      </div>
      <ul id="user-dropdown" class="user-dropdown hidden"></ul>
    </div>
  </div>

  <div class="tab-panel hidden" id="panel-asset">
    <div class="input-group">
      <input
        type="text"
        id="tag-input"
        placeholder="{{ labels.search_placeholder_tag }}{% if rfid_enabled %} / {{ labels.search_placeholder_tag_rfid_hint }}{% endif %}"
        autocomplete="off"
        class="input"
      >
      <button type="button" class="btn btn-primary" onclick="lookupAsset()">
        {{ labels.btn_lookup_asset }}
      </button>
    </div>
    {% if rfid_enabled %}
    <div id="rfid-status" class="rfid-status hidden"></div>
    {% endif %}
  </div>
</div>

<script>
const RFID_ENABLED = {{ 'true' if rfid_enabled else 'false' }};
const LABELS = {
  rfid_range_invalid: {{ labels.rfid_range_invalid | tojson }},
  rfid_range_starting: {{ labels.rfid_range_starting | tojson }},
  rfid_range_done: {{ labels.rfid_range_done | tojson }},
  rfid_range_error: {{ labels.rfid_range_error | tojson }},
};
</script>
<script src="{{ request.root_path }}/static/index.js"></script>
{% endblock %}
