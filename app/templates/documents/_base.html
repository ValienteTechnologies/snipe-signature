<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4 landscape;
    margin: 1.5cm 1.5cm 2cm 1.5cm;
    {% if footer_text %}
    @bottom-center {
      content: "{{ footer_text }}";
      font-size: 9pt;
      color: #888;
    }
    {% endif %}
  }
  html { height: 100%; }
  body {
    font-family: "DejaVu Sans", Arial, sans-serif;
    font-size: 11pt;
    color: #1a1a1a;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .content-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .body-center {
    display: flex;
    flex-direction: column;
    flex: 1;
    justify-content: center;
  }
{% block extra_styles %}{% endblock %}
</style>
</head>
<body>
<div class="content-wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
