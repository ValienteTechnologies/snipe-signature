<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4 landscape;
    margin: 1.5cm 1.5cm 2cm 1.5cm;
    {% if footer_text %}
    @bottom-center {
      content: "{{ footer_text }}";
      font-size: 7pt;
      color: #888;
    }
    {% endif %}
  }
  body {
    font-family: "DejaVu Sans", Arial, sans-serif;
    font-size: 9pt;
    color: #1a1a1a;
  }
{% block extra_styles %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
