<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ labels.page_title }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<button class="drawer-toggle" onclick="toggleDrawer()" aria-label="Menu">&#9776;</button>

<div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>

<nav class="drawer" id="drawer">
  <div class="drawer-header">
    <a href="/" class="drawer-title">{{ labels.page_title }}</a>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <span class="drawer-label">Language</span>
      <select class="input drawer-select" id="lang-select" onchange="setLang(this.value)">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
    </div>
    <div class="drawer-section">
      <span class="drawer-label">Template</span>
      <select class="input drawer-select" id="tmpl-select" onchange="setTemplate(this.value)">
        {% for tid, tlabel in doc_templates %}
        <option value="{{ tid }}">{{ tlabel }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<script>
const _defaultTemplate = {{ ('"' ~ doc_templates[0][0] ~ '"') if doc_templates else '"uwagi"' }};

function getCookie(name) {
  const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return m ? m.pop() : null;
}
function setCookie(name, val) {
  document.cookie = name + '=' + val + ';path=/;max-age=31536000;SameSite=Lax';
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

function setLang(lang) {
  setCookie('lang', lang);
  location.reload();
}
function setTemplate(tmpl) {
  localStorage.setItem('doc-template', tmpl);
}

document.addEventListener('DOMContentLoaded', () => {
  const lang = getCookie('lang') || 'en';
  const langSel = document.getElementById('lang-select');
  if (langSel) langSel.value = lang;

  const stored = localStorage.getItem('doc-template');
  const tmplSel = document.getElementById('tmpl-select');
  if (tmplSel) {
    if (stored && tmplSel.querySelector('option[value="' + stored + '"]')) {
      tmplSel.value = stored;
    }
    localStorage.setItem('doc-template', tmplSel.value);
  } else if (!stored) {
    localStorage.setItem('doc-template', _defaultTemplate);
  }
});
</script>
</body>
</html>
