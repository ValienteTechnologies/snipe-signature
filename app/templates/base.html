<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ labels.page_title }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="drawer">
  <div class="drawer-header">
    <a href="/" class="drawer-title">{{ labels.page_title }}</a>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <span class="drawer-label">Language</span>
      <select class="input drawer-select" id="lang-select" onchange="setLang(this.value)">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
    </div>
    <div class="drawer-section">
      <span class="drawer-label">Template</span>
      <select class="input drawer-select" id="tmpl-select" onchange="setTemplate(this.value)">
        {% for tid, tlabel in doc_templates %}
        <option value="{{ tid }}">{{ tlabel }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
</nav>

<main class="main-content">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="/static/drawer.js"></script>
</body>
</html>
